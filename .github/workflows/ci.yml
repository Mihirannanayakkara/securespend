name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build api --configuration Release
      - run: dotnet test api.Tests
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd web && npm install && npm run build
      - name: Build images
        run: |
          docker build -t securespend-api api
          docker build -t securespend-web web
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: securespend-api, severity: 'CRITICAL,HIGH', exit-code: '0' }
